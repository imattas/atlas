[package]
name = "atlas-gpu-vulkan-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }

[dev-dependencies]
atlas-search-gpu = { path = "../atlas-search-gpu" }
atlas-search-ir = { path = "../atlas-search-ir" }

[[bin]]
name = "atlas-gpu-vulkan-run"
path = "src/main.rs"

[lib]
name = "atlas_gpu_vulkan_adapter"
path = "src/lib.rs"
