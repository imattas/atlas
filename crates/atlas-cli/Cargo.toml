[package]
name = "atlas-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-report = { path = "../atlas-report" }
atlas-scheduler = { path = "../atlas-scheduler" }
atlas-search-gpu = { path = "../atlas-search-gpu" }
atlas-search-ir = { path = "../atlas-search-ir" }
atlas-search-native = { path = "../atlas-search-native" }
