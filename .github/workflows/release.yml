name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release manifest
        run: python scripts/write_release_manifest.py --validate RELEASE_MANIFEST.toml

      - name: Test release metadata
        run: python -m unittest discover tests/release

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          archive="atlas-${{ github.ref_name }}.zip"
          git archive --format=zip --output "$archive" HEAD
          sha256sum "$archive" RELEASE_MANIFEST.toml > "atlas-${version}-checksums.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          gh release create "$version" \
            "atlas-${{ github.ref_name }}.zip" \
            "atlas-${version}-checksums.txt" \
            "RELEASE_MANIFEST.toml" \
            --title "AtlasCTF ${version}" \
            --notes "Automated AtlasCTF release with source archive, checksums, and release manifest."
