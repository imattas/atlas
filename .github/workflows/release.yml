name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI binary
        run: cargo build --release --target "${{ matrix.target }}" -p atlas-cli --bin atlas

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/atlas" "dist/atlas-${{ steps.version.outputs.version }}-${{ matrix.target }}"

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/atlas.exe" "dist/atlas-${{ steps.version.outputs.version }}-${{ matrix.target }}.exe"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          # release asset template: atlas-${version}-${{ matrix.target }}
          name: atlas-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: release-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release manifest
        run: python scripts/write_release_manifest.py --validate RELEASE_MANIFEST.toml

      - name: Test release metadata
        run: python -m unittest discover tests/release

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "workflow_dispatch version must look like v0.1.0, got: $version" >&2
              exit 2
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="atlas-${version}-source.zip"
          git archive --format=zip --output "$archive" HEAD
          sha256sum "$archive" RELEASE_MANIFEST.toml > "atlas-${version}-checksums.txt"

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-${{ steps.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          test -f "dist/atlas-${version}-x86_64-unknown-linux-gnu"
          test -f "dist/atlas-${version}-x86_64-apple-darwin"
          test -f "dist/atlas-${version}-x86_64-pc-windows-msvc.exe"
          sha256sum "dist"/* >> "atlas-${version}-checksums.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          target_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target_args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$version" \
            "atlas-${version}-source.zip" \
            "atlas-${version}-checksums.txt" \
            "RELEASE_MANIFEST.toml" \
            dist/* \
            --title "AtlasCTF ${version}" \
            --latest \
            "${target_args[@]}" \
            --notes "Automated AtlasCTF release with source archive, checksums, and release manifest."
