[workspace]
members = [
    "crates/atlas-protocol",
    "crates/atlas-ucir",
    "crates/atlas-analysis",
    "crates/atlas-facts",
    "crates/atlas-planner",
    "crates/atlas-scheduler",
    "crates/atlas-validator",
    "crates/atlas-cache",
    "crates/atlas-report",
    "crates/atlas-cli",
    "crates/atlas-program",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/atlasctf"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
